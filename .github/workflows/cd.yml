name: cd 

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy 
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push Docker image
        run: |
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/project-6764af5b-1d4e-4279-9c8/notely-ar-repo/notely:latest .
        
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/project-6764af5b-1d4e-4279-9c8/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project project-6764af5b-1d4e-4279-9c8 --max-instances=4